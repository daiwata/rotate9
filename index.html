        (i + 1) + (i < tutorialStep ? ' ✓' : '') + '</span>';
    });
    elStat.classList.add('tutorial');
    elStat.classList.remove('win');
    var lessonTitle = localizedGuide(tutorialKind).title;
    elStat.innerHTML =
      '<div class="hint-title">' + lessonTitle + ' — ' + tr('step') + ' ' +
      (tutorialStep + 1) + ' / ' + tutorialSteps.length + '</div>' +
      '<div class="hint-steps">' + chips.join('') + '</div>' +
      '<div class="hint-reason">' + (tutorialHintVisible
        ? localizedStepWhy(tutorialKind, tutorialStep) + ' ' + tr('shownDirection')
        : tr('thinkOrHint')) + '</div>';
  }

  function advanceTutorial(){
    if (!tutorialOn) return;
    tutorialStep++;
    tutorialHintVisible = false;
    hintBtn.classList.remove('live');
    hintLabel.textContent = tr('hintShow');
    refresh();
    if (tutorialStep < tutorialSteps.length){
      renderTutorial();
      return;
    }
    clearPreview();
    if (demoUsed || hintUsed){
      var assistedReason = demoUsed
        ? tr('solutionPlayed')
        : tr('hintCompleted');
      elStat.classList.remove('win');
      elStat.innerHTML =
        '<div class="hint-title">' + tr('answerChecked') + '</div>' +
        '<div class="hint-reason">' + assistedReason + ' ' + tr('tryAgain') + '</div>';
      tutorialWinFeedback(assistedReason + ' ' + tr('tryAgain'), true);
      return;
    }
    elStat.classList.add('win');
    if (tutorialKind === 'escape'){
      elStat.innerHTML =
        '<div class="hint-title">' + tr('success') + ': ' + tr('escapeSuccess') + '</div>' +
        '<div class="hint-reason">' + tr('escapeTip') + '</div>';
      tutorialWinFeedback(tr('escapeSuccess'));
    } else {
      var pair = tutorialKind === 'adjacent' ? '8–9' : (tutorialKind === 'diagonal' ? '5–9' : '6–8');
      elStat.innerHTML =
        '<div class="hint-title">' + tr('success') + ': ' + tr('swapSuccess', {pair:pair}) + '</div>' +
        '<div class="hint-reason">' + tr('swapTip') + '</div>';
      tutorialWinFeedback(tr('swapSuccess', {pair:pair}));
    }
  }

  function startTutorial(kind){
    if (busy || demoOn) return;
    stopDemo(true);
    freeMode = false;
    tutorialKind = kind || 'adjacent';
    tutorialSteps = tutorialKind === 'adjacent' ? adjacentTutorialSteps :
      (tutorialKind === 'diagonal' ? diagonalTutorialSteps :
      (tutorialKind === 'diagonal68' ? diagonal68TutorialSteps : escapeTutorialSteps));
    qualityMode = false; hintUsed = false; demoUsed = false;
    hintBtn.classList.remove('live');
    hintLabel.textContent = tr('hintShow');
    board.classList.remove('won');
    tiles.forEach(function(t){ t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; });
    clearTutorialRejectNotice();
    tutorialOn = true; tutorialStep = 0; tutorialHintVisible = false;
    solved = false; moves = 0; history = [];
    state = tutorialGuideData[tutorialKind].state.slice();
    relayout();
    elMoves.textContent = '0';
    setKnobsEnabled(true);
    mixBtn.disabled = true;
    tutorialBtn.classList.add('live');
    refresh();
    renderTutorial();
  }

  function stopTutorial(startGame){
    clearTutorialRejectNotice();
    tutorialOn = false; tutorialStep = 0; tutorialHintVisible = false;
    elStat.classList.remove('tutorial');
    clearPreview();
    tutorialBtn.classList.remove('live');
    mixBtn.disabled = false; resetBtn.disabled = false; hintBtn.disabled = false; demoBtn.disabled = false;
    if (startGame) scramble(puzzlePar, true);
    else refresh();
  }

  function saveFreeSession(){
    if (!freeMode) return;
    freeSession = {
      state:state.slice(),
      moves:moves,
      history:history.map(function(move){ return {p:move.p, cw:move.cw}; }),
      hintUsed:hintUsed,
      demoUsed:demoUsed
    };
  }

  function startFreeGame(mode){
    if (busy || demoOn) return;
    mode = mode || 'resume';
    if (tutorialOn) stopTutorial(false);
    stopDemo(true);
    closeCelebration();
    board.classList.remove('won');
    clearPreview();
    qualityMode = false; hintUsed = false; demoUsed = false;
    hintBtn.classList.remove('live');
    hintLabel.textContent = tr('hintShow');
    freeMode = true; solved = false; moves = 0; history = []; busy = false;
    var resuming = mode === 'resume' && freeSession;
    if (resuming){
      state = freeSession.state.slice();
      moves = freeSession.moves;
      history = freeSession.history.map(function(move){ return {p:move.p, cw:move.cw}; });
      hintUsed = freeSession.hintUsed;
      demoUsed = freeSession.demoUsed;
    } else if (mode === 'reset' && freeInitial){
      state = freeInitial.slice();
    } else {
      state = [0,1,2,3,4,5,6,7,8];
      var lastP = -1, lastCw = false;
      for (var i = 0; i < 36; i++){
        var p, cw;
        do {
          p = Math.floor(Math.random() * PIVOT_COUNT);
          cw = Math.random() < .5;
        } while (p === lastP && cw !== lastCw);
        state = permuteArray(state, p, cw);
        lastP = p; lastCw = cw;
      }
      freeInitial = state.slice();
      freeSession = null;
    }
    scrambleMoves = [];
    relayout();
    setKnobsEnabled(true);
    refresh();
    saveFreeSession();
    say(tr(resuming ? 'freeResume' : 'freeIntro'));
    showStartFeedback();
  }

  function nextPuzzle(){
    if (tutorialOn || freeMode || busy || demoOn || stageNo >= 15) return;
    stageNo++;
    puzzlePar = stageNo >= 13 ? 5 : (stageNo >= 10 ? 4 : Math.min(3, Math.ceil(stageNo / 3)));
    scramble(puzzlePar, true);
  }

  function updateStageOptions(){
    progressSteps.forEach(function(step, index){
      var number = index + 1;
      var par = number >= 13 ? 5 : (number >= 10 ? 4 : Math.min(3, Math.ceil(number / 3)));
      var label = tr('puzzleIntro', {stage:number, par:par});
      step.setAttribute('aria-label', label);
      step.title = label;
    });
  }

  function prevPuzzle(){
    if (stageNo <= 1 || tutorialOn || busy || demoOn) return;
    stageNo--;
    puzzlePar = stageNo >= 13 ? 5 : (stageNo >= 10 ? 4 : Math.min(3, Math.ceil(stageNo / 3)));
    scramble(puzzlePar, true);
  }

  function runIntro(){
    introOn = true;
    stageNo = 1; puzzlePar = 1;
    scramble(1, false);
    showIntroCard();
  }

  function startGestureDemo(){
    if (gestureTimer) clearTimeout(gestureTimer);
    gestureBoard.classList.add('resetting');
    var solution = [
      { p:0, cw:true },
      { p:3, cw:true },
      { p:1, cw:true }
    ];
    var demoState = [0,1,2,3,4,5,6,7,8];
    for (var i = solution.length - 1; i >= 0; i--){
      demoState = permuteArray(demoState, solution[i].p, !solution[i].cw);
    }
    var step = 0;
    function positionGestureTiles(){
      gestureTiles.forEach(function(tile, id){
        var pos = demoState.indexOf(id);
        var x = 14 + (pos % 3) * 56;
        var y = 14 + Math.floor(pos / 3) * 56;
        tile.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      });
    }
    function renderGesture(){
      gestureBoard.classList.toggle('complete', step >= 3);
      positionGestureTiles();
      gesturePivots.forEach(function(pivot, p){
        pivot.classList.remove('active');
        pivot.removeAttribute('data-arrow');
      });
      if (step < 3){
        var pivotX = solution[step].p % 2 ? 123 : 67;
        var pivotY = solution[step].p >= 2 ? 123 : 67;
        /* left/top は丸の左上なので、半径9pxを引いて中心を交点の右27pxへ合わせる */
        gestureFinger.style.left = (pivotX + 18) + 'px';
        gestureFinger.style.top = (pivotY - 9) + 'px';
        gestureFinger.classList.remove('swipe-down', 'swipe-up');
        void gestureFinger.offsetWidth;
        gestureFinger.classList.add(solution[step].cw ? 'swipe-down' : 'swipe-up');
        gestureStep.textContent = tr('gestureMove', {
          step:step + 1,
          direction:solution[step].cw ? tr('down') : tr('up')
        });
        gestureTimer = setTimeout(function(){
          /* 指と軸は現在の手に残したまま、スワイプに追従して盤面を回す */
          demoState = permuteArray(demoState, solution[step].p, solution[step].cw);
          positionGestureTiles();
          gestureTimer = setTimeout(function(){
            step++;
            renderGesture();
          }, reduce ? 300 : 650);
        }, reduce ? 180 : 300);
      } else {
        gestureFinger.classList.remove('swipe-down', 'swipe-up');
        gestureStep.textContent = tr('gestureDone');
        gestureTimer = setTimeout(startGestureDemo, reduce ? 1600 : 2600);
      }
    }
    gestureBoard.classList.remove('complete');
    positionGestureTiles();
    gesturePivots.forEach(function(pivot){
      pivot.classList.remove('active');
      pivot.removeAttribute('data-arrow');
    });
    gestureFinger.classList.remove('swipe-down', 'swipe-up');
    gestureStep.textContent = tr('gestureStart');
    /* 完成盤面から初期盤面へは回転させず、一瞬で戻す */
    void gestureBoard.offsetWidth;
    gestureBoard.classList.remove('resetting');
    /* 戻った盤面を少し見せてから、1手目のスワイプを始める */
    gestureTimer = setTimeout(renderGesture, reduce ? 500 : 850);
  }

  function showIntroCard(){
    introOverlay.classList.add('show');
    startGestureDemo();
    setTimeout(function(){ startBtn.focus(); }, 50);
  }

  function showHelp(){
    if (introOn || busy || demoOn) return;
    introReview = true;
    introOn = true;
    startBtn.textContent = tr('backGame');
    showIntroCard();
  }

  function renderTutorialGuide(kind){
    var data = tutorialGuideData[kind];
    var copy = localizedGuide(kind);
    tutorialGuideTabs.forEach(function(tab){
      tab.setAttribute('aria-pressed', String(tab.dataset.tutorialKind === kind));
    });
    tutorialGuideTitle.textContent = copy.title;
    tutorialGuideLead.textContent = copy.lead;
    tutorialGuideDifficulty.textContent = copy.difficulty;
    tutorialGuideMastery.textContent = copy.mastery;
    tutorialGuideBoard.setAttribute('aria-label', copy.aria);
    tutorialGuideBoard.innerHTML = '';

    data.state.forEach(function(value){
      var number = value + 1;
      var tile = document.createElement('span');
      tile.className = 'tutorial-guide-tile' +
        (data.focus.indexOf(number) >= 0 ? ' focus' : '');
      tile.textContent = String(number);
      tile.setAttribute('aria-hidden', 'true');
      tutorialGuideBoard.appendChild(tile);
    });

    data.arrows.forEach(function(arrowData){
      var arrow = document.createElement('span');
      arrow.className = 'tutorial-guide-arrow';
      arrow.textContent = arrowData.mark;
      arrow.style.left = arrowData.left;
      arrow.style.top = arrowData.top;
      arrow.style.setProperty('--guide-angle', arrowData.angle + 'deg');
      arrow.setAttribute('aria-hidden', 'true');
      tutorialGuideBoard.appendChild(arrow);
    });
  }

  function openTutorialGuide(kind){
    if (busy || demoOn) return;
    if (tutorialOn) stopTutorial(false);
    closeAdvanced();
    pendingTutorialKind = kind;
    tutorialGuideOn = true;
    renderTutorialGuide(kind);
    tutorialGuideOverlay.classList.add('show');
    setTimeout(function(){ tutorialGuideStartBtn.focus(); }, 50);
  }

  function closeTutorialGuide(reopenMenu){
    tutorialGuideOn = false;
    pendingTutorialKind = null;
    tutorialGuideOverlay.classList.remove('show');
    if (reopenMenu) setTimeout(openAdvanced, 50);
    else advancedBtn.focus();
  }

  function beginTutorialFromGuide(){
    var kind = pendingTutorialKind;
    if (!kind) return;
    tutorialGuideOn = false;
    pendingTutorialKind = null;
    tutorialGuideOverlay.classList.remove('show');
    startTutorial(kind);
    setTimeout(function(){ hintBtn.focus(); }, 50);
  }

  function openAdvanced(){
    if (introOn || tutorialGuideOn || busy || demoOn) return;
    if (freeMode) saveFreeSession();
    advancedOn = true;
    advancedOverlay.classList.add('show');
    setTimeout(function(){ advancedCloseBtn.focus(); }, 50);
  }

  function closeAdvanced(){
    advancedOn = false;
    advancedOverlay.classList.remove('show');
    advancedBtn.focus();
  }

  function beginGame(){
    introOverlay.classList.remove('show');
    if (gestureTimer){ clearTimeout(gestureTimer); gestureTimer = null; }
    introOn = false;
    if (introReview){
      introReview = false;
      startBtn.textContent = tr('start');
      refresh();
      return;
    }
    stageRecords = Object.create(null);
    undoBtn.disabled = resetBtn.disabled = hintBtn.disabled = strategyBtn.disabled = mixBtn.disabled = demoBtn.disabled =
      tutorialBtn.disabled = freeBtn.disabled =
      prevBtn.disabled = nextBtn.disabled = false;
    stageNo = 1; puzzlePar = 1;
    scramble(1, false);
  }

  function startDemo(){
    if (busy || solved || (tutorialOn && tutorialStep >= tutorialSteps.length)) return;
    if (freeMode && !fullSolverMove){
      startSolverWorker();
      say(tr('solverPrep'));
      return;
    }
    var queue = tutorialOn
      ? tutorialSteps.slice(tutorialStep).map(function(step){ return { p:step.p, cw:step.cw }; })
      : autoQueue();
    if (!queue.length) return;

    demoOn = true; demoUsed = true;
    if (tutorialOn){
      tutorialHintVisible = false;
      hintBtn.classList.remove('live');
      hintLabel.textContent = tr('hintShow');
    }
    clearPreview();
    setKnobsEnabled(false);
    undoBtn.disabled = true; resetBtn.disabled = true; mixBtn.disabled = true;
    hintBtn.disabled = true; strategyBtn.disabled = true;
    demoBtn.classList.add('live');
    demoLabel.textContent = tr('stop');

    var total = queue.length, n = 0;
    (function next(){
      if (!demoOn) return;
      if (n >= total){ stopDemo(); return; }
      var mv = queue[n++];
      say('AUTO ' + n + ' / ' + total + ' — ' + (mv.cw ? tr('right') : tr('left')) + ' 90°');
      knobs[mv.p].classList.add('hot');
      knobs[mv.p].classList.add(mv.cw ? 'press-cw' : 'press-ccw');
      orbits[mv.p].classList.add('show');
      orbits[mv.p].classList.toggle('rev', !mv.cw);
      demoTimer = setTimeout(function(){
        if (!demoOn) return;
        rotate(mv.p, mv.cw, { log: true, count: tutorialOn, force: !tutorialOn, fast: true, after: function(){
          knobs[mv.p].classList.remove('hot');
          knobs[mv.p].classList.remove('press-cw');
          knobs[mv.p].classList.remove('press-ccw');
          orbits[mv.p].classList.remove('show');
          demoTimer = setTimeout(next, reduce ? 220 : 300);
        }});
      }, reduce ? 60 : 300);
    })();
  }

  function stopDemo(silent){
    if (demoTimer){ clearTimeout(demoTimer); demoTimer = null; }
    var wasOn = demoOn;
    demoOn = false;
    clearPreview();
    setKnobsEnabled(!solved);
    mixBtn.disabled = tutorialOn;
    demoBtn.classList.remove('live');
    demoLabel.textContent = tr('answer');
    refresh();
    if (wasOn && !silent && !solved){
      say(tutorialOn ? tr('autoStopLesson') : tr('autoStop'));
    }
  }

  function undo(){
    if (busy || demoOn || !history.length) return;
    if (tutorialOn){
      if (celebration) celebration.classList.remove('show');
      elStat.classList.remove('win');
      var tutorialLast = history.pop();
      moves = Math.max(0, moves - 1);
      tutorialStep = Math.max(0, tutorialStep - 1);
      tutorialHintVisible = false;
      hintBtn.classList.remove('live');
      hintLabel.textContent = tr('hintShow');
      rotate(tutorialLast.p, !tutorialLast.cw, {
        force:true,
        after:function(){
          renderTutorial();
          say(tr('undoLesson'));
        }
      });
      return;
    }
    if (solved){
      solved = false;
      if (celebration) celebration.classList.remove('show');
      board.classList.remove('won');
      tiles.forEach(function(t){ t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; });
      setKnobsEnabled(true);
      nextBtn.innerHTML = '<span class="nav-label">' + tr('next') + '</span> →';
    }
    var last = history.pop();
    moves = Math.max(0, moves - 1);
    rotate(last.p, !last.cw, {
      after:function(){ if (freeMode) saveFreeSession(); }
    });
    say(tr('undoDone'));
  }

  function resetPuzzle(){
    if (busy || demoOn || introOn) return;
    if (tutorialOn){
      if (celebration) celebration.classList.remove('show');
      startTutorial(tutorialKind);
      say(tr('restartLesson'));
      showResetFeedback();
      return;
    }
    if (freeMode){
      startFreeGame('reset');
      say(tr('resetFree'));
      showResetFeedback();
      return;
    }
    scramble(puzzlePar, true);
    say(tr('resetPuzzle'));
    showResetFeedback();
  }

  undoBtn.addEventListener('click', undo);
  resetBtn.addEventListener('click', resetPuzzle);
  mixBtn.addEventListener('click', function(){ if (freeMode) startFreeGame('new'); else scramble(); });
  strategyBtn.addEventListener('click', showStrategyHint);
  hintBtn.addEventListener('click', showHint);
  demoBtn.addEventListener('click', toggleDemo);
  tutorialBtn.addEventListener('click', function(){
    openTutorialGuide(tutorialOn ? tutorialKind : 'adjacent');
  });
  normalModeBtn.addEventListener('click', function(){
    closeAdvanced();
    if (tutorialOn) stopTutorial(true);
    else if (freeMode){
      scramble(puzzlePar, true);
    }
  });
  tutorialGuideTabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      pendingTutorialKind = tab.dataset.tutorialKind;
      renderTutorialGuide(pendingTutorialKind);
    });
  });
  freeBtn.addEventListener('click', function(){
    closeAdvanced();
    if (!freeMode) startFreeGame('resume');
  });
  nextBtn.addEventListener('click', nextPuzzle);
  prevBtn.addEventListener('click', prevPuzzle);
  startBtn.addEventListener('click', beginGame);
  helpBtn.addEventListener('click', showHelp);
  advancedBtn.addEventListener('click', openAdvanced);
  advancedCloseBtn.addEventListener('click', closeAdvanced);
  advancedOverlay.addEventListener('click', function(e){
    if (e.target === advancedOverlay) closeAdvanced();
  });
  tutorialGuideStartBtn.addEventListener('click', beginTutorialFromGuide);
  tutorialGuideCloseBtn.addEventListener('click', function(){ closeTutorialGuide(true); });
  tutorialGuideOverlay.addEventListener('click', function(e){
    if (e.target === tutorialGuideOverlay) closeTutorialGuide(true);
  });
  languageToggle.addEventListener('click', function(e){
    e.stopPropagation();
    var open = !languageMenu.classList.contains('show');
    languageMenu.classList.toggle('show', open);
    languageToggle.setAttribute('aria-expanded', String(open));
    if (open) languageButtons.find(function(button){ return button.dataset.lang === currentLang; }).focus();
  });
  languageButtons.forEach(function(button){
    button.addEventListener('click', function(){
      applyLanguage(button.dataset.lang);
      languageMenu.classList.remove('show');
      languageToggle.setAttribute('aria-expanded', 'false');
      languageToggle.focus();
    });
  });
  document.addEventListener('click', function(e){
    if (!e.target.closest('.language-picker')){
      languageMenu.classList.remove('show');
      languageToggle.setAttribute('aria-expanded', 'false');
    }
  });

  /* ---------- 起動 ---------- */
  build();
  bindKnobs();
  applyLanguage('ja');
  startSolverWorker();
  updateStageOptions();
  if (embedMode) beginGame();
  else runIntro();
  if (window.ResizeObserver){
    new ResizeObserver(function(){ if (!busy && !drag) relayout(); }).observe(board);
  } else {
    window.addEventListener('resize', function(){ if (!busy && !drag) relayout(); });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

  if (embedMode && window.parent !== window){
    var embedStage = document.querySelector('.stage');
    var reportEmbedHeight = function(){
      requestAnimationFrame(function(){
        var bodyStyle = getComputedStyle(document.body);
        var height = embedStage.getBoundingClientRect().bottom +
          window.scrollY + parseFloat(bodyStyle.paddingBottom);
        window.parent.postMessage({
          type:'rotate9:height',
          height:Math.ceil(height)
        }, location.origin === 'null' ? '*' : location.origin);
      });
    };

    if (window.ResizeObserver) new ResizeObserver(reportEmbedHeight).observe(embedStage);
    window.addEventListener('resize', reportEmbedHeight);
    window.addEventListener('load', reportEmbedHeight);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportEmbedHeight);
    reportEmbedHeight();
  }
})();
</script>
</body>
</html>
