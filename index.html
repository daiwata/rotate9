<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROTATE NINE — 4枚を回す数字パズル</title>
<script>
  if (new URLSearchParams(location.search).get('embed') === '1') {
    document.documentElement.classList.add('embed');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Space+Grotesk:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0e1620;
    --panel:#16202e;
    --panel-2:#1b273a;
    --line:#2a3a52;
    --brass:#d0a852;
    --brass-dim:#7d6836;
    --teal:#5ac9b4;
    --bone:#ece7db;
    --ink:#16202e;
    --muted:#8b9cb4;
    --zone-a:rgba(64,151,176,.18);
    --zone-b:rgba(126,112,181,.16);
    --zone-c:rgba(200,157,73,.17);
    --zone-d:rgba(73,165,129,.17);
    --jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    --num:"Space Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
    --logo:"Orbitron","Space Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  .sr-only{
    position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;
    overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;
  }
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 90% at 50% -20%, #1c2a3d 0%, rgba(28,42,61,0) 60%),
      var(--void);
    color:var(--bone);
    font-family:var(--jp);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;justify-content:center;
    padding:28px 18px 48px;
  }
  .stage{width:100%;max-width:900px}

  /* ---- header ---- */
  header{margin-bottom:16px}
  .header-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .eyebrow{
    font-family:var(--num);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--brass);margin:0;display:flex;align-items:center;gap:10px;flex:1;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--brass-dim),transparent)}
  .help-btn{
    flex:0 0 auto;padding:6px 10px;border:1px solid var(--line);border-radius:999px;
    background:rgba(22,32,46,.72);color:var(--muted);
    font-family:var(--jp);font-size:12px;font-weight:700;cursor:pointer;
  }
  .help-btn:hover{border-color:var(--teal);color:var(--teal)}
  .help-btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  h1{
    margin:0;font-family:var(--logo);font-size:clamp(32px,6.5vw,52px);font-weight:700;
    letter-spacing:.12em;line-height:1;color:var(--bone);
    text-shadow:0 8px 26px rgba(0,0,0,.34);
  }
  h1 em{
    display:inline-block;font-style:normal;font-weight:700;color:var(--teal);
    letter-spacing:.025em;
    text-shadow:0 0 22px rgba(90,201,180,.18);
  }
  .challenge-title{
    margin:13px 0 6px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;gap:4px 12px;
    font-size:clamp(22px,4.5vw,32px);font-weight:700;letter-spacing:.02em;line-height:1.25;
  }
  .challenge-title em{font-style:normal;color:var(--teal)}
  .headline-stage{
    flex:0 0 auto;color:var(--muted);font-family:var(--num);
    font-size:clamp(13px,2.8vw,17px);font-weight:700;letter-spacing:.08em;
  }
  .headline-moves{
    flex:0 0 auto;color:var(--muted);font-size:clamp(12px,2.6vw,15px);font-weight:500;
  }
  .headline-moves b{color:var(--bone);font-family:var(--num);font-size:1.25em}
  .stage-progress{margin-top:2px}
  .progress-nav{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .progress-nav button{
    min-height:28px;padding:4px 9px;border:1px solid var(--line);border-radius:5px;
    background:var(--panel);color:var(--muted);font-family:var(--jp);font-size:11px;
    cursor:pointer;
  }
  .progress-nav button:hover{border-color:var(--brass);color:var(--bone)}
  .progress-nav button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .progress-nav button:disabled{visibility:hidden}
  .progress-track{display:flex;gap:3px}
  .progress-step{flex:1 1 0;min-width:0;height:29px;padding:10px 0;border:0;background:transparent;cursor:pointer}
  .progress-step::before{
    content:"";display:block;height:9px;border-radius:4px;background:var(--line);
    transition:background .2s,transform .2s;
  }
  .progress-step:nth-child(3n+1):not(:first-child){margin-left:5px}
  .progress-step.done::before{background:var(--teal)}
  .progress-step.current::before{
    background:transparent;box-shadow:inset 0 0 0 2px var(--brass);transform:scaleY(1.3);
  }
  .progress-step.done.current::before{
    background:var(--teal);box-shadow:0 0 0 2px var(--brass);
  }
  .progress-step:hover::before{filter:brightness(1.35)}
  .progress-step:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
  .progress-step:disabled{cursor:default;opacity:.45}

  /* ---- layout ---- */
  .play{display:flex;column-gap:34px;row-gap:14px;align-items:flex-start;flex-wrap:wrap}
  .board-wrap{flex:0 0 auto;width:min(100%,420px)}

  /* ---- board ---- */
  .board{
    position:relative;width:100%;aspect-ratio:1;
    background:linear-gradient(160deg,#1a2637,#121b28);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 24px 60px -30px #000, inset 0 1px 0 rgba(255,255,255,.05);
    touch-action:none;                 /* 盤の上のスワイプは回転に使う */
    user-select:none;-webkit-user-select:none;
  }
  .board::after{
    content:"";position:absolute;inset:6px;border:1px solid rgba(208,168,82,.16);border-radius:6px;pointer-events:none;
  }
  .board::before{
    content:"";position:absolute;inset:0;z-index:7;border-radius:10px;pointer-events:none;
    background:radial-gradient(circle at var(--impact-x,50%) var(--impact-y,50%),
      rgba(90,201,180,.38) 0,rgba(90,201,180,.14) 9%,transparent 28%);
    opacity:0;
  }

  .tile{
    position:absolute;top:0;left:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(175deg,#f3eee3 0%,#ddd5c4 100%);
    color:var(--ink);
    font-family:var(--num);font-weight:700;
    border-radius:5px;
    box-shadow:0 2px 0 #b3a992, 0 6px 12px -6px rgba(0,0,0,.7);
    will-change:transform;cursor:grab;
    transition:opacity .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .tile span{transform:translateY(-.02em)}
  .tile span{position:relative;z-index:2}
  .tile::after{
    content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;
    pointer-events:none;opacity:1;filter:saturate(1.35) brightness(1.08);
    transition:opacity .18s ease,filter .18s ease;
  }
  .tile.zone-0::after{background:var(--zone-a)}
  .tile.zone-1::after{background:linear-gradient(90deg,var(--zone-a) 0 50%,var(--zone-b) 50% 100%)}
  .tile.zone-2::after{background:var(--zone-b)}
  .tile.zone-3::after{background:linear-gradient(180deg,var(--zone-a) 0 50%,var(--zone-c) 50% 100%)}
  .tile.zone-4::after{
    background:
      linear-gradient(var(--zone-a),var(--zone-a)) 0 0/50% 50% no-repeat,
      linear-gradient(var(--zone-b),var(--zone-b)) 100% 0/50% 50% no-repeat,
      linear-gradient(var(--zone-c),var(--zone-c)) 0 100%/50% 50% no-repeat,
      linear-gradient(var(--zone-d),var(--zone-d)) 100% 100%/50% 50% no-repeat;
  }
  .tile.zone-5::after{background:linear-gradient(180deg,var(--zone-b) 0 50%,var(--zone-d) 50% 100%)}
  .tile.zone-6::after{background:var(--zone-c)}
  .tile.zone-7::after{background:linear-gradient(90deg,var(--zone-c) 0 50%,var(--zone-d) 50% 100%)}
  .tile.zone-8::after{background:var(--zone-d)}
  .board.previewing .tile.lit::after{filter:saturate(1.6) brightness(1.12)}
  .board.dragging .tile::after{opacity:0;filter:none}
  .tile.home::before{
    content:"✓";position:absolute;right:5px;top:5px;width:16px;height:16px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    background:var(--teal);color:var(--ink);
    font-family:var(--num);font-size:11px;font-weight:700;line-height:1;
    box-shadow:0 1px 3px rgba(0,0,0,.24);
  }
  .tile.home{background:linear-gradient(175deg,#f6f2e6 0%,#e4dfcd 100%)}
  .board.dragging,.board.dragging .tile{cursor:grabbing}
  .board.move-done{animation:boardSettle .4s cubic-bezier(.2,.8,.3,1)}
  .board.move-done::before{animation:boardFlash .46s ease-out}
  .tile.just-moved{animation:tileSettle .4s cubic-bezier(.16,.9,.3,1)}
  .tile.home.landed-home::before{animation:homePop .5s cubic-bezier(.15,1.4,.3,1)}
  .knob.impact .dot::before{animation:pivotImpact .46s ease-out}
  @keyframes boardSettle{
    0%{transform:scale(.975)}
    34%{transform:scale(1.012);box-shadow:0 32px 76px -24px #000,inset 0 0 0 3px rgba(90,201,180,.48)}
    100%{transform:scale(1)}
  }
  @keyframes boardFlash{0%{opacity:1;transform:scale(.68)}100%{opacity:0;transform:scale(1.15)}}
  @keyframes tileSettle{
    0%{filter:brightness(1.2);box-shadow:0 0 0 2px rgba(90,201,180,.7),0 4px 0 #b3a992,0 14px 22px -9px rgba(0,0,0,.9)}
    55%{filter:brightness(1.08);box-shadow:0 0 0 1px rgba(90,201,180,.3),0 3px 0 #b3a992,0 10px 16px -8px rgba(0,0,0,.8)}
  }
  @keyframes homePop{
    0%{transform:scale(.25) rotate(-18deg);opacity:0}
    60%{transform:scale(1.25) rotate(4deg)}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  @keyframes pivotImpact{
    0%{box-shadow:0 0 0 0 rgba(90,201,180,.65)}
    100%{transform:translate(-50%,-50%) scale(2.8);box-shadow:0 0 0 12px rgba(90,201,180,0);opacity:0}
  }
  .move-spark{
    position:absolute;z-index:11;width:7px;height:7px;border-radius:2px;
    left:var(--impact-x);top:var(--impact-y);pointer-events:none;
    background:var(--teal);box-shadow:0 0 8px rgba(90,201,180,.8);
    animation:moveSpark .5s cubic-bezier(.1,.7,.2,1) both;
  }
  .move-spark.brass{background:var(--brass);box-shadow:0 0 8px rgba(208,168,82,.8)}
  @keyframes moveSpark{
    0%{transform:translate(-50%,-50%) scale(1.2) rotate(0);opacity:1}
    100%{transform:translate(calc(-50% + var(--spark-x)),calc(-50% + var(--spark-y))) scale(.2) rotate(180deg);opacity:0}
  }
  .reset-notice{
    position:absolute;left:50%;top:50%;z-index:10;transform:translate(-50%,-50%) scale(.9);
    padding:10px 20px;border:1px solid var(--brass);border-radius:999px;
    background:rgba(14,22,32,.92);color:var(--brass);
    font-size:18px;font-weight:700;letter-spacing:.08em;
    opacity:0;pointer-events:none;
  }
  .reset-notice.show{animation:resetNotice .9s ease both}
  .reset-notice.start{
    padding:11px 24px;border-color:var(--teal);color:var(--teal);
    font-family:var(--num);font-size:20px;letter-spacing:.14em;
    box-shadow:0 0 26px rgba(90,201,180,.28);
  }
  .reset-notice.final{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    min-width:230px;padding:17px 30px;border-radius:12px;
    border-color:var(--brass);color:var(--brass);
    box-shadow:0 0 38px rgba(208,168,82,.42);
    animation:finalNotice 2.15s ease both;
  }
  .reset-notice.final strong{font-family:var(--num);font-size:25px;letter-spacing:.16em}
  .reset-notice.final small{color:var(--bone);font-size:13px;font-weight:700;letter-spacing:.08em}
  .board.reset-feedback{animation:resetBoard .7s ease}
  .board.final-feedback{animation:finalBoard 1.9s ease}
  .board.reset-feedback .tile{filter:brightness(1.08)}
  @keyframes resetNotice{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.88)}
    18%,68%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-56%) scale(1)}
  }
  @keyframes resetBoard{
    35%{box-shadow:0 24px 60px -30px #000,inset 0 0 0 3px rgba(208,168,82,.55)}
  }
  @keyframes finalNotice{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}
    16%,78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-54%) scale(1.04)}
  }
  @keyframes finalBoard{
    35%{box-shadow:0 24px 60px -30px #000,inset 0 0 0 3px rgba(208,168,82,.72),0 0 42px rgba(208,168,82,.25)}
  }
  .board.previewing .tile{opacity:.5;filter:saturate(.5)}
  .board.previewing .tile.lit{
    opacity:1;filter:none;
    box-shadow:0 0 0 2px var(--teal), 0 3px 0 #b3a992, 0 14px 22px -10px rgba(0,0,0,.85);
  }
  .board.quality-same .tile.lit{box-shadow:0 0 0 2px var(--brass),0 3px 0 #b3a992,0 14px 22px -10px rgba(0,0,0,.85)}
  .board.quality-bad .tile.lit{box-shadow:0 0 0 2px #e47b71,0 3px 0 #b3a992,0 14px 22px -10px rgba(0,0,0,.85)}
  .quality-label{
    position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    z-index:8;padding:5px 9px;border-radius:999px;background:rgba(14,22,32,.9);
    border:1px solid var(--teal);color:var(--teal);
    font-family:var(--num);font-size:11px;font-weight:700;letter-spacing:.04em;
    opacity:0;transition:opacity .12s ease;pointer-events:none;white-space:nowrap;
  }
  .quality-label.show{opacity:1}
  .quality-label.same{border-color:var(--brass);color:var(--brass)}
  .quality-label.bad{border-color:#e47b71;color:#e47b71}
  .celebration{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(8,14,22,.72);backdrop-filter:blur(5px);
    overflow:hidden;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease;
  }
  .celebration.show{opacity:1;visibility:visible;pointer-events:auto}
  .celebration-card{
    position:relative;z-index:2;width:min(100%,390px);max-height:calc(100dvh - 40px);overflow:auto;
    padding:30px 26px 24px;
    border:1px solid var(--teal);border-radius:14px;text-align:center;
    background:linear-gradient(160deg,#1b2b3d,#121c29);color:var(--bone);
    box-shadow:0 28px 90px rgba(0,0,0,.55),0 0 42px rgba(90,201,180,.2);
  }
  .celebration-label{
    margin:0;color:var(--teal);font-family:var(--num);
    font-size:clamp(34px,10vw,52px);font-weight:700;letter-spacing:.08em;
    text-shadow:0 0 28px rgba(90,201,180,.45);
  }
  .celebration-message{margin:10px 0 22px;color:var(--bone);font-size:15px;line-height:1.7}
  .celebration-actions{display:grid;gap:9px}
  .celebration-next,.celebration-close{
    width:100%;min-height:52px;border-radius:8px;font-family:var(--jp);font-size:15px;font-weight:700;cursor:pointer;
  }
  .celebration-next{border:1px solid var(--teal);background:var(--teal);color:var(--ink)}
  .celebration-next:hover{filter:brightness(1.08)}
  .celebration-close{border:1px solid var(--line);background:transparent;color:var(--muted)}
  .celebration-close:hover{border-color:var(--muted);color:var(--bone)}
  .celebration-next:focus-visible,.celebration-close:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
  .celebration-next[hidden],.celebration-close[hidden]{display:none}
  .all-clear-extra{display:none;margin:4px 0 12px;padding-top:14px;border-top:1px solid var(--line)}
  .all-clear-extra.show{display:block}
  .all-clear-extra p{margin:0 0 10px;color:var(--muted);font-size:12px;line-height:1.6}
  .all-clear-links{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .all-clear-links button{
    min-height:42px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
    color:var(--bone);font-family:var(--jp);font-size:12px;font-weight:700;cursor:pointer;
  }
  .all-clear-links button:first-child{grid-column:1/-1;border-color:var(--brass);color:var(--brass)}
  .all-clear-links button:hover{border-color:var(--teal);color:var(--teal)}
  .celebration.show .celebration-card{animation:clearDialog .32s cubic-bezier(.2,.8,.25,1) both}
  .confetti{
    position:absolute;left:50%;top:38%;width:7px;height:11px;border-radius:2px;
    background:var(--teal);opacity:0;
  }
  .confetti:nth-child(3n){background:var(--brass)}
  .confetti:nth-child(3n+1){background:var(--bone)}
  .celebration.show .confetti{animation:confettiBurst .9s ease-out var(--delay) both}
  @keyframes clearDialog{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
  @keyframes confettiBurst{
    0%{transform:translate(-50%,-50%) scale(.5) rotate(0);opacity:1}
    100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r));opacity:0}
  }

  /* ---- knob : 交点のつまみ（左半分=↺ / 右半分=↻） ---- */
  .knob{
    position:absolute;top:0;left:0;width:0;height:0;z-index:5;
    --k:64px; --kp:6px; --kr:calc((var(--k) - var(--kp)*2)/2);
  }
  .knob .dot{
    position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;
    background:var(--panel-2);border:1px solid rgba(208,168,82,.72);
    box-shadow:0 0 0 3px rgba(14,22,32,.9);
    transition:opacity .14s ease,border-color .14s ease,box-shadow .14s ease;pointer-events:none;
  }
  .knob .dot::before{
    content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;
    transform:translate(-50%,-50%);border-radius:50%;
    border:1px solid rgba(208,168,82,.18);
    background:
      linear-gradient(rgba(208,168,82,.22),rgba(208,168,82,.22)) center/1px 5px no-repeat,
      linear-gradient(90deg,rgba(208,168,82,.22),rgba(208,168,82,.22)) center/5px 1px no-repeat;
    transition:border-color .14s ease,transform .14s ease,background .14s ease;
  }
  .knob.candidate .dot{
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(14,22,32,.9),0 0 12px rgba(90,201,180,.28);
  }
  .knob.candidate .dot::before{
    transform:translate(-50%,-50%) scale(1.12);
    border-color:rgba(90,201,180,.72);
    background:
      linear-gradient(var(--teal),var(--teal)) center/1px 5px no-repeat,
      linear-gradient(90deg,var(--teal),var(--teal)) center/5px 1px no-repeat;
  }
  .half{
    position:absolute;top:calc(var(--k) / -2);height:var(--k);width:calc(var(--k) / 2);
    padding:0;border:0;background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--k) * .36);line-height:1;
  }
  .half.ccw{left:calc(var(--k) / -2)}
  .half.cw{left:0}
  .half::before{
    content:"";position:absolute;top:var(--kp);bottom:var(--kp);
    background:var(--panel-2);border:1px solid var(--brass-dim);
    opacity:0;transition:opacity .14s ease,background .14s ease,border-color .14s ease,transform .14s ease;
  }
  .half.ccw::before{left:var(--kp);right:0;border-right:0;border-radius:var(--kr) 0 0 var(--kr)}
  .half.cw::before{left:0;right:var(--kp);border-left:0;border-radius:0 var(--kr) var(--kr) 0}
  .half.ccw::before{transform-origin:right center}
  .half.cw::before{transform-origin:left center}
  .half span{
    position:relative;color:var(--brass);opacity:0;
    transition:opacity .14s ease,color .14s ease;
  }
  .half::before{box-shadow:0 5px 16px rgba(0,0,0,.28)}
  .knob.hot .dot{opacity:0}
  .knob.hot .half::before{opacity:1;transform:scale(1.28)}
  .knob.hot .half span{opacity:1}
  .knob.hot.press-cw .half.ccw::before,.knob.hot.press-cw .half.ccw span,
  .knob.hot.press-ccw .half.cw::before,.knob.hot.press-ccw .half.cw span{opacity:.1}
  .knob.hot.press-cw .half.cw span,.knob.hot.press-ccw .half.ccw span{
    font-size:1.55em;font-weight:700;animation:hintPulse .45s ease-in-out infinite alternate;
  }
  .knob.hot .half:hover::before,.half:focus-visible::before{
    background:#09111a;border-color:var(--teal);transform:scale(1.28);
    box-shadow:0 7px 22px rgba(0,0,0,.42),0 0 16px rgba(90,201,180,.25);
  }
  .half:hover span,.half:focus-visible span{
    color:var(--teal);opacity:1;font-size:1.55em;font-weight:700;
    text-shadow:0 0 12px rgba(90,201,180,.7);
  }
  .knob:has(.half:hover) .half:not(:hover)::before,
  .knob:has(.half:hover) .half:not(:hover) span{opacity:.08}
  .half:focus{outline:none}
  .half:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
  .half:disabled{cursor:default}
  /* AUTO再生中に「いま押している側」を光らせる */
  .knob.press-cw .half.cw::before,.knob.press-ccw .half.ccw::before{background:#14313a;border-color:var(--teal)}
  .knob.press-cw .half.cw span,.knob.press-ccw .half.ccw span{color:var(--teal)}
  .board.quality-same .knob.press-cw .half.cw::before,.board.quality-same .knob.press-ccw .half.ccw::before{border-color:var(--brass)}
  .board.quality-same .knob.press-cw .half.cw span,.board.quality-same .knob.press-ccw .half.ccw span{color:var(--brass)}
  .board.quality-bad .knob.press-cw .half.cw::before,.board.quality-bad .knob.press-ccw .half.ccw::before{border-color:#e47b71}
  .board.quality-bad .knob.press-cw .half.cw span,.board.quality-bad .knob.press-ccw .half.ccw span{color:#e47b71}
  .knob.hinting .half::before,.knob.hinting .half span{opacity:.12}
  .knob.hinting.press-cw .half.cw::before,
  .knob.hinting.press-cw .half.cw span,
  .knob.hinting.press-ccw .half.ccw::before,
  .knob.hinting.press-ccw .half.ccw span{opacity:1}
  .knob.hinting.press-cw .half.cw span,
  .knob.hinting.press-ccw .half.ccw span{
    font-size:1.35em;font-weight:700;
    animation:hintPulse .8s ease-in-out infinite alternate;
  }
  .knob.evaluating .half::before,.knob.evaluating .half span{opacity:.1}
  .knob.evaluating.press-cw .half.cw::before,
  .knob.evaluating.press-cw .half.cw span,
  .knob.evaluating.press-ccw .half.ccw::before,
  .knob.evaluating.press-ccw .half.ccw span{opacity:1}
  .knob.evaluating.press-cw .half.cw span,
  .knob.evaluating.press-ccw .half.ccw span{font-size:1.35em;font-weight:700}
  .knob.evaluating.cw-good .half.cw::before,.knob.evaluating.ccw-good .half.ccw::before{opacity:1;border-color:var(--teal)}
  .knob.evaluating.cw-good .half.cw span,.knob.evaluating.ccw-good .half.ccw span{opacity:1;color:var(--teal)}
  .knob.evaluating.cw-same .half.cw::before,.knob.evaluating.ccw-same .half.ccw::before{opacity:1;border-color:var(--brass)}
  .knob.evaluating.cw-same .half.cw span,.knob.evaluating.ccw-same .half.ccw span{opacity:1;color:var(--brass)}
  .knob.evaluating.cw-bad .half.cw::before,.knob.evaluating.ccw-bad .half.ccw::before{opacity:1;border-color:#e47b71}
  .knob.evaluating.cw-bad .half.cw span,.knob.evaluating.ccw-bad .half.ccw span{opacity:1;color:#e47b71}
  @keyframes hintPulse{to{transform:scale(1.25);text-shadow:0 0 10px rgba(90,201,180,.8)}}

  .orbit{
    position:absolute;top:0;left:0;border-radius:50%;
    border:1px dashed rgba(90,201,180,.5);
    opacity:0;transition:opacity .16s ease;pointer-events:none;z-index:1;
  }
  .orbit.show{opacity:1;animation:spin 9s linear infinite}
  .orbit.show.rev{animation-direction:reverse}
  .orbit.show.hinting{animation:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- panel ---- */
  .panel{flex:1 1 280px;min-width:270px}
  .controls{display:grid;gap:12px}
  .primary-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .primary-actions{grid-template-columns:repeat(6,1fr)}
  .primary-actions .btn{grid-column:span 2;min-height:36px;padding:6px 10px}
  .primary-actions #hintBtn,.primary-actions #demoBtn{grid-column:span 3}
  button.btn{
    font-family:var(--jp);font-size:13px;font-weight:700;color:var(--bone);
    background:var(--panel);border:1px solid var(--line);border-radius:7px;
    min-height:44px;padding:10px 12px;cursor:pointer;text-align:center;
    transition:border-color .15s ease,background .15s ease,color .15s ease;
  }
  button.btn:hover{border-color:var(--brass);background:var(--panel-2)}
  button.btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  button.btn:disabled{opacity:.4;cursor:default}
  button.btn:disabled:hover{border-color:var(--line);background:var(--panel)}
  #demoBtn{grid-column:auto;border-color:var(--brass-dim)}
  #demoBtn.live{border-color:var(--teal);color:var(--teal);background:#14313a}
  #hintBtn{grid-column:auto;border-color:rgba(90,201,180,.55)}
  #hintBtn.live{border-color:var(--teal);color:var(--teal);background:#14313a}
  #tutorialBtn{grid-column:1/-1;border-color:rgba(208,168,82,.45)}
  #tutorialBtn.live{
    border-color:var(--teal);color:var(--teal);background:#14313a;
  }
  #nextBtn{border-color:rgba(90,201,180,.55);color:var(--teal)}
  .status{
    border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:7px;
    background:rgba(22,32,46,.65);padding:11px 13px;
    font-size:14px;line-height:1.65;color:var(--bone);
    height:calc(3.3em + 24px);overflow:hidden;margin:0;
  }
  .status-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
  .status-head span{color:var(--muted);font-size:10px;letter-spacing:.14em}
  #strategyBtn{
    min-height:30px;padding:4px 10px;border:1px solid rgba(90,201,180,.5);border-radius:999px;
    background:rgba(90,201,180,.07);color:var(--teal);
    font-family:var(--jp);font-size:12px;font-weight:700;cursor:pointer;
  }
  #strategyBtn:hover{border-color:var(--teal);background:rgba(90,201,180,.14)}
  #strategyBtn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  #strategyBtn:disabled{opacity:.35;cursor:default}
  #strategyBtn.attention{animation:strategyAttention 1.1s ease}
  @keyframes strategyAttention{
    0%,100%{box-shadow:none;transform:scale(1)}
    35%{box-shadow:0 0 0 5px rgba(90,201,180,.15),0 0 18px rgba(90,201,180,.22);transform:scale(1.035)}
  }
  .status.hint-reveal{animation:hintReveal .75s ease}
  .status.move-hint-reveal{animation:moveHintReveal 1.9s ease}
  @keyframes hintReveal{
    0%{border-color:var(--line);border-left-color:var(--brass);background:rgba(22,32,46,.65)}
    28%{border-color:var(--teal);background:rgba(20,49,58,.9);box-shadow:0 0 22px rgba(90,201,180,.2)}
    100%{border-color:var(--line);border-left-color:var(--teal);background:rgba(22,32,46,.65)}
  }
  @keyframes moveHintReveal{
    0%{border-color:var(--line);border-left-color:var(--brass);background:rgba(22,32,46,.65)}
    15%,70%{border-color:var(--teal);border-left-color:var(--teal);background:rgba(20,49,58,.92);box-shadow:0 0 26px rgba(90,201,180,.26)}
    100%{border-color:var(--line);border-left-color:var(--brass);background:rgba(22,32,46,.65);box-shadow:none}
  }
  .status:not(.tutorial){display:flex;align-items:center}
  .status.tutorial{height:auto;min-height:calc(3.3em + 24px);overflow:visible}
  .status.win{border-color:var(--teal);color:var(--teal)}
  .hint-title{color:var(--teal);font-weight:700;margin-bottom:5px}
  .hint-steps{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}
  .hint-step{
    display:inline-flex;align-items:center;gap:4px;padding:3px 7px;
    border:1px solid var(--line);border-radius:4px;background:rgba(27,39,58,.7);
    font-family:var(--num);font-size:12px;
  }
  .hint-step:first-child{border-color:var(--teal);color:var(--teal)}
  .hint-reason{color:var(--muted);font-size:12px}

  .intro-overlay{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(8,13,20,.76);backdrop-filter:blur(8px);
    opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s ease;
  }
  .intro-overlay.show{opacity:1;visibility:visible}
  .intro-card{
    width:min(100%,430px);padding:26px;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(160deg,#1b283a,#121b28);
    box-shadow:0 30px 80px -24px #000;text-align:left;
  }
  .intro-kicker{margin:0 0 8px;color:var(--teal);font-family:var(--num);font-size:11px;font-weight:700;letter-spacing:.18em}
  .intro-card h2{margin:0 0 10px;font-size:25px;line-height:1.35}
  .intro-card>p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
  .advanced-card{width:min(100%,520px)}
  .advanced-actions{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 10px;
  }
  .advanced-actions .btn{min-height:54px}
  .advanced-actions .menu-normal{
    grid-column:1/-1;border-color:var(--teal);color:var(--teal);font-weight:700;
  }
  .advanced-actions .advanced-free{
    grid-column:1/-1;border-color:var(--brass);color:var(--brass);
  }
  .advanced-close{
    width:100%;border:0;background:transparent;color:var(--muted);
    padding:10px;border-radius:7px;cursor:pointer;font:inherit;
  }
  .advanced-close:hover{color:var(--bone);background:rgba(255,255,255,.05)}

  /* ---- lesson guide ---- */
  .tutorial-guide-card{
    position:relative;
    width:min(100%,520px);
    max-height:calc(100dvh - 40px);
    overflow:auto;
  }
  .tutorial-guide-close{
    position:absolute;top:12px;right:12px;
    width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:50%;
    background:rgba(22,32,46,.8);color:var(--muted);
    font-family:var(--jp);font-size:20px;line-height:1;cursor:pointer;
  }
  .tutorial-guide-close:hover{border-color:var(--teal);color:var(--teal)}
  .tutorial-guide-close:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .tutorial-guide-tabs{
    display:grid;grid-template-columns:1fr 1fr;gap:7px;
    margin:14px 0 18px;
  }
  .tutorial-guide-tab{
    min-height:42px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
    background:rgba(22,32,46,.65);color:var(--muted);
    font-family:var(--jp);font-size:12px;line-height:1.35;cursor:pointer;
  }
  .tutorial-guide-tab:hover{border-color:var(--brass);color:var(--bone)}
  .tutorial-guide-tab[aria-pressed="true"]{
    border-color:var(--teal);background:#14313a;color:var(--teal);font-weight:700;
  }
  .tutorial-guide-tab:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
  .tutorial-guide-lead{
    margin:0 0 14px!important;color:var(--bone)!important;
    font-size:16px!important;font-weight:700;text-align:center;
  }
  .tutorial-guide-board{
    position:relative;
    display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
    width:min(72vw,220px);aspect-ratio:1;
    margin:0 auto 16px;padding:8px;
    border:1px solid var(--line);border-radius:10px;
    background:linear-gradient(160deg,#1a2637,#121b28);
  }
  .tutorial-guide-tile{
    display:grid;place-items:center;border-radius:5px;
    background:linear-gradient(175deg,#f3eee3,#ddd5c4);
    color:var(--ink);font-family:var(--num);font-size:24px;font-weight:700;
    box-shadow:0 2px 0 #b3a992;
  }
  .tutorial-guide-tile.focus{
    color:#083d3b;
    box-shadow:0 0 0 3px var(--teal),0 2px 0 #409180,0 0 18px rgba(90,201,180,.35);
  }
  .tutorial-guide-arrow{
    position:absolute;z-index:3;
    display:grid;place-items:center;
    min-width:34px;height:34px;padding:0 3px;border-radius:999px;
    background:rgba(14,22,32,.92);color:var(--teal);
    font-family:var(--num);font-size:27px;font-weight:700;line-height:1;
    transform:translate(-50%,-50%) rotate(var(--guide-angle,0deg));
    text-shadow:0 0 10px rgba(90,201,180,.6);
    pointer-events:none;
  }
  .tutorial-guide-copy{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:0 0 16px;
  }
  .tutorial-guide-copy section{
    padding:12px;border:1px solid var(--line);border-radius:8px;
    background:rgba(22,32,46,.65);
  }
  .tutorial-guide-copy h3{
    margin:0 0 5px;color:var(--brass);
    font-size:13px;letter-spacing:.06em;
  }
  .tutorial-guide-copy p{
    margin:0;color:var(--muted);font-size:14px;line-height:1.8;
  }
  .tutorial-guide-start{
    width:100%;min-height:52px;border:1px solid var(--teal);border-radius:8px;
    background:#14313a;color:var(--teal);
    font-family:var(--jp);font-size:16px;font-weight:700;cursor:pointer;
  }
  .tutorial-guide-start:hover{background:#19404a}
  .tutorial-guide-start:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
  .intro-gesture{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:center;margin:18px 0}
  .gesture-board{
    position:relative;width:190px;height:190px;border:1px solid var(--line);border-radius:10px;
    background:linear-gradient(160deg,#1a2637,#121b28);overflow:hidden;
  }
  .gesture-tile{
    position:absolute;width:50px;height:50px;border-radius:5px;
    display:grid;place-items:center;background:linear-gradient(175deg,#f3eee3,#ddd5c4);
    color:var(--ink);font-family:var(--num);font-size:18px;font-weight:700;
    box-shadow:0 2px 0 #b3a992;
    transition:transform .52s cubic-bezier(.25,.75,.2,1),filter .25s;
  }
  .gesture-board.resetting .gesture-tile{transition:none}
  .gesture-pivot{
    position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);
    background:var(--panel-2);border:1px solid rgba(90,201,180,.45);z-index:3;
  }
  .gesture-pivot:nth-of-type(1){left:67px;top:67px}
  .gesture-pivot:nth-of-type(2){left:123px;top:67px}
  .gesture-pivot:nth-of-type(3){left:67px;top:123px}
  .gesture-pivot:nth-of-type(4){left:123px;top:123px}
  .gesture-finger{
    position:absolute;width:18px;height:18px;border-radius:50%;z-index:6;pointer-events:none;
    background:var(--teal);box-shadow:0 0 0 5px rgba(90,201,180,.2),0 0 15px rgba(90,201,180,.65);
    opacity:0;
  }
  .gesture-finger.swipe-down{animation:gestureSwipeDown .9s ease-in-out}
  .gesture-finger.swipe-up{animation:gestureSwipeUp .9s ease-in-out}
  @keyframes gestureSwipeDown{
    0%{transform:translateY(-24px) scale(.75);opacity:0}
    18%{transform:translateY(-24px) scale(1);opacity:1}
    78%{transform:translateY(24px) scale(1);opacity:1}
    100%{transform:translateY(24px) scale(.75);opacity:0}
  }
  @keyframes gestureSwipeUp{
    0%{transform:translateY(24px) scale(.75);opacity:0}
    18%{transform:translateY(24px) scale(1);opacity:1}
    78%{transform:translateY(-24px) scale(1);opacity:1}
    100%{transform:translateY(-24px) scale(.75);opacity:0}
  }
  .gesture-clear{
    position:absolute;inset:0;z-index:8;display:grid;place-items:center;
    background:rgba(13,22,31,.22);color:var(--teal);font-family:var(--num);
    font-size:25px;font-weight:700;letter-spacing:.08em;
    opacity:0;pointer-events:none;
  }
  .gesture-board.complete{animation:gestureBoardClear .9s ease-out}
  .gesture-board.complete .gesture-tile{filter:brightness(1.18);box-shadow:0 0 0 2px var(--teal),0 7px 18px -6px #000}
  .gesture-board.complete .gesture-clear{animation:gestureClearLabel 1.8s ease both}
  @keyframes gestureBoardClear{
    35%{box-shadow:0 0 0 2px var(--teal),0 0 32px rgba(90,201,180,.42)}
  }
  @keyframes gestureClearLabel{
    0%,18%{opacity:0;transform:scale(.86)}
    34%,78%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.04)}
  }
  .gesture-copy b{display:block;margin-bottom:5px;color:var(--bone);font-size:14px}
  .gesture-copy span{display:block;color:var(--muted);font-size:12px;line-height:1.65}
  .gesture-copy em{color:var(--teal);font-style:normal;font-weight:700}
  #startBtn{
    width:100%;min-height:52px;border:1px solid var(--teal);border-radius:8px;
    background:#14313a;color:var(--teal);font-family:var(--jp);font-size:16px;font-weight:700;
    cursor:pointer;box-shadow:0 0 24px rgba(90,201,180,.12);
  }
  #startBtn:hover{background:#19404a}
  #startBtn:focus-visible{outline:2px solid var(--bone);outline-offset:3px}

  /* ---- win ---- */
  .board.won .tile{animation:pop .5s ease both}
  @keyframes pop{
    35%{box-shadow:0 0 0 2px var(--teal),0 2px 0 #b3a992,0 10px 20px -8px rgba(0,0,0,.8);filter:brightness(1.12)}
  }

  @media (max-width:720px){
    html,body{overflow-x:hidden}
    body{padding:20px 14px 40px}
    header{margin-bottom:10px}
    .challenge-title{
      flex-wrap:nowrap;gap:4px 9px;font-size:clamp(17px,5vw,21px);white-space:nowrap;
    }
    .challenge-title>span:nth-child(2){font-size:clamp(20px,6vw,24px)}
    .headline-stage{font-size:clamp(9px,2.7vw,12px);letter-spacing:0}
    .headline-moves{font-size:clamp(9px,2.7vw,12px)}
    .progress-nav{gap:3px}
    .progress-nav button{min-height:25px;padding:3px 4px;font-size:9px}
    .play{row-gap:12px}
    .board-wrap{width:100%;margin:0 auto}
    .panel{min-width:0}
    .intro-card{padding:22px}
    .intro-gesture{grid-template-columns:1fr;justify-items:center;gap:10px}
    .gesture-copy{text-align:center}
    .celebration{
      display:block;padding:0;backdrop-filter:none;transition:none;
    }
    .celebration-card{
      position:absolute;left:20px;right:20px;top:max(28px,16vh);
      width:auto;max-height:calc(84vh - 28px);transform:none!important;
    }
    .celebration.show .celebration-card{animation:none}
    .board.move-done{animation:boardSettleMobile .4s ease}
  }
  @media (max-width:340px){
    .progress-nav .nav-label{display:none}
    .progress-nav button{min-width:24px}
  }
  @media (max-width:520px){
    .advanced-actions{grid-template-columns:1fr}
    .advanced-actions .menu-normal,.advanced-actions .advanced-free{grid-column:auto}
    .tutorial-guide-card{padding:16px 14px}
    .tutorial-guide-card .intro-kicker{margin-bottom:5px}
    .tutorial-guide-close{
      top:8px;right:8px;width:32px;height:32px;font-size:18px;
    }
    .tutorial-guide-tabs{
      grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0 10px;
    }
    .tutorial-guide-tab{
      min-width:0;min-height:40px;padding:4px 2px;
      font-size:13px;font-weight:700;line-height:1.2;
    }
    .tutorial-guide-card h2{margin-bottom:5px;font-size:21px}
    .tutorial-guide-lead{
      margin-bottom:8px!important;font-size:15px!important;line-height:1.5!important;
    }
    .tutorial-guide-board{
      width:142px;margin-bottom:10px;padding:6px;gap:4px;
    }
    .tutorial-guide-tile{font-size:20px}
    .tutorial-guide-arrow{min-width:28px;height:28px;font-size:23px}
    .tutorial-guide-copy{
      grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;
    }
    .tutorial-guide-copy section{padding:8px}
    .tutorial-guide-copy h3{margin-bottom:3px;font-size:12px}
    .tutorial-guide-copy p{font-size:14px;line-height:1.55}
    .tutorial-guide-start{min-height:46px;font-size:15px}
  }
  @keyframes boardSettleMobile{
    45%{box-shadow:0 28px 68px -28px #000,inset 0 0 0 2px rgba(90,201,180,.35)}
  }
  @media (pointer:coarse){
    /* スマホは軸だけを見せ、盤面全体をスワイプ操作に使う */
    .knob .dot{opacity:.9}
    .knob .dot::before{border-color:rgba(208,168,82,.3)}
    .knob .half{pointer-events:none}
    .knob .half::before,.knob .half span{opacity:0!important}
  }
  @media (prefers-reduced-motion:reduce){
    .orbit.show{animation:none}
    .board.won .tile{animation:none}
    .celebration.show .confetti{display:none}
    .celebration.show .celebration-card{animation:none}
    .gesture-tile{transition:none}
    .move-spark{display:none}
    .reset-notice.show{animation:none;opacity:1;transform:translate(-50%,-50%)}
    .board.reset-feedback{animation:none}
    *{transition-duration:.01ms !important}
  }

  /* ---- 埋め込み表示 ---- */
  html.embed,html.embed body{min-height:0}
  html.embed body{
    padding:14px 12px 18px;
    overflow:hidden;
  }
  html.embed .header-top{
    justify-content:flex-end;
    gap:8px;
    margin-bottom:6px;
  }

    var r = Math.floor(i / SIZE), c = i % SIZE;
    return { x: PAD + c * (CELL + GAP), y: PAD + r * (CELL + GAP) };

    board.appendChild(frag);
  }

  function place(id, i){
    var p = cellXY(i);
    tiles[id].style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
  }
  function relayout(){
    measure();
    var f = Math.round(CELL * 0.42);
    for (var id = 0; id < TILE_COUNT; id++){
      var t = tiles[id];
      t.style.width = CELL + 'px'; t.style.height = CELL + 'px';
      t.style.fontSize = f + 'px';
    }
    for (var i = 0; i < TILE_COUNT; i++) place(state[i], i);
    // 4枚の中心が乗る円の半径（交点から駒の中心までの距離）
    var R = Math.hypot((CELL + GAP) / 2, (CELL + GAP) / 2);
    for (var p2 = 0; p2 < PIVOT_COUNT; p2++){
      var k = knobXY(p2);
      knobs[p2].style.transform = 'translate(' + k.x + 'px,' + k.y + 'px)';
      var o = orbits[p2];
      o.style.width = o.style.height = (R * 2) + 'px';
      o.style.marginLeft = o.style.marginTop = (-R) + 'px';
      o.style.left = k.x + 'px'; o.style.top = k.y + 'px';
    }
  }

  function setKnobsEnabled(on){
    knobs.forEach(function(k){
      var b = k.querySelectorAll('button');
      for (var i = 0; i < b.length; i++) b[i].disabled = !on;
    });
  }

  /* ---------- 描画の更新 ---------- */
  function refresh(){
    if (state.length !== TILE_COUNT) return;
    var n = 0;
    for (var i = 0; i < TILE_COUNT; i++){
      var home = state[i] === i;
      var tile = tiles[state[i]];
      if (home) n++;
      tile.classList.toggle('home', home);
      if (tile.dataset.zone !== String(i)){
        if (tile.dataset.zone != null) tile.classList.remove('zone-' + tile.dataset.zone);
        tile.dataset.zone = String(i);
        tile.classList.add('zone-' + i);
      }
    }
    headlinePar.textContent = tutorialOn ? '5' : (freeMode ? '?' : puzzlePar);
    headlineStage.textContent = tutorialOn ? 'LESSON' :
      (freeMode ? '上級者用フリー' : '問題 ' + stageNo + ' / 15');
    stageProgress.hidden = tutorialOn || freeMode;
    if (!tutorialOn && !freeMode){
      progressSteps.forEach(function(stepEl, index){
        stepEl.classList.toggle('done', clearedStages.has(index + 1));
        stepEl.classList.toggle('current', index + 1 === stageNo);
        if (index + 1 === stageNo) stepEl.setAttribute('aria-current', 'step');
        else stepEl.removeAttribute('aria-current');
        stepEl.disabled = busy || demoOn || introOn;
      });
    }
    elMoves.textContent = moves;
    undoBtn.disabled = history.length === 0 || busy || demoOn;
    resetBtn.disabled = busy || demoOn;
    hintBtn.disabled = busy || demoOn || (tutorialOn ? tutorialStep >= tutorialSteps.length : solved);
    strategyBtn.disabled = busy || solved || demoOn || tutorialOn || freeMode;
    demoBtn.disabled = busy || (tutorialOn && tutorialStep >= tutorialSteps.length);
    nextBtn.disabled = busy || demoOn || tutorialOn || freeMode || stageNo >= 15;
    prevBtn.disabled = stageNo <= 1 || busy || demoOn || tutorialOn || freeMode;
    tutorialBtn.disabled = busy || demoOn;
    freeBtn.disabled = busy || demoOn || tutorialOn;
    if (introOn){
      undoBtn.disabled = resetBtn.disabled = hintBtn.disabled = strategyBtn.disabled = mixBtn.disabled = demoBtn.disabled =
        tutorialBtn.disabled = freeBtn.disabled =
        prevBtn.disabled = nextBtn.disabled = true;
    }
  }

  /* 交点 p まわりに90°回した並びを返す（描画はしない） */
  function permute(p, cw){
    var cyc = cellsOf(p), next = state.slice();
    for (var k = 0; k < 4; k++){
      if (cw) next[cyc[(k+1) % 4]] = state[cyc[k]];
      else    next[cyc[k]] = state[cyc[(k+1) % 4]];
    }
    return next;
  }

  /* 手を1つ記録する（手数と時計を進める） */
  function logMove(p, cw){
    history.push({ p: p, cw: cw });
    moves++;
  }

  /* レッスンで違う操作を選んだとき、回してから元へ戻して反応を伝える */
  function rejectTutorialMove(p, cw){
    var cyc = cellsOf(p), kc = knobXY(p), items = [];
    for (var j = 0; j < 4; j++){
      var from = cellCenter(cyc[j]);
      items.push({
        el:tiles[state[cyc[j]]],
        ox:from.x - kc.x,
        oy:from.y - kc.y
      });
    }
    clearPreview();
    preview(p, true, cw);
    knobs[p].classList.add(cw ? 'press-cw' : 'press-ccw');
    busy = true;
    tutorialRejecting = true;
    refresh();
    var direction = cw ? 1 : -1;
    var done = 0;
    items.forEach(function(item){
      var frames = [0,45,90,45,0].map(function(deg){
        return { transform:xf(item, deg * direction, kc) };
      });
      var animation = item.el.animate(frames, {
        duration:reduce ? 1 : 380,
        easing:'cubic-bezier(.35,.05,.2,1)'
      });
      animation.onfinish = animation.oncancel = function(){
        if (++done === 4){
          for (var q = 0; q < 4; q++) place(state[cyc[q]], cyc[q]);
          clearPreview();
          refresh();
          setTimeout(function(){
            tutorialRejecting = false;
            busy = false;
            refresh();
            renderTutorial();
          }, 1000);
        }
      };
    });
  }

  /* ---------- 回転 ----------
     opts.log   : history に積む
     opts.count : 手数と時間を進める
     opts.force : solved 状態でも動かす（AUTO再生用）
     opts.fast  : AUTO再生用に少し速く
     opts.after : 回り終わったときに呼ぶ                        */
  function rotate(p, cw, opts){
    opts = opts || {};
    if (busy || (solved && !opts.force)) return;
    var tutorialMove = tutorialOn && !opts.force;
    if (tutorialMove && !tutorialAllows(p, cw, 1)){
      rejectTutorialMove(p, cw);
      return;
    }
    var cyc = cellsOf(p);
    var next = permute(p, cw);

    var kc = knobXY(p);
    var anims = [];
    for (var j = 0; j < 4; j++){
      var id = state[cyc[j]];
      var from = cellCenter(cyc[j]);
      var dx = from.x - kc.x, dy = from.y - kc.y;
      var half = 0.7071067811865476;            // cos45 = sin45
      var mx, my, ex, ey;
      if (cw){ mx = dx*half - dy*half; my = dx*half + dy*half; ex = -dy; ey = dx; }
      else   { mx = dx*half + dy*half; my = -dx*half + dy*half; ex = dy; ey = -dx; }
      anims.push({
        el: tiles[id],
        a: 'translate(' + (from.x - CELL/2) + 'px,' + (from.y - CELL/2) + 'px)',
        b: 'translate(' + (kc.x + mx - CELL/2) + 'px,' + (kc.y + my - CELL/2) + 'px)',
        c: 'translate(' + (kc.x + ex - CELL/2) + 'px,' + (kc.y + ey - CELL/2) + 'px)'
      });
    }

    state = next;
    for (var m = 0; m < anims.length; m++) anims[m].el.style.transform = anims[m].c;

    if (opts.log && opts.count) logMove(p, cw);
    else if (opts.log) history.push({ p: p, cw: cw });

    var dur = reduce ? 1 : (opts.fast ? 280 : 190);
    busy = true;
    var done = 0;
    anims.forEach(function(o){
      var an = o.el.animate(
        [{ transform: o.a }, { transform: o.b }, { transform: o.c }],
        { duration: dur, easing: 'cubic-bezier(.35,.05,.2,1)' }
      );
      an.onfinish = an.oncancel = function(){
        if (++done === 4){
          busy = false; moveFeedback(cyc, p); refresh(); check();
          if (tutorialMove) advanceTutorial();
          if (opts.after) opts.after();
        }
      };
    });
    refresh();
  }

  function check(){
    if (solved) return;
    for (var i = 0; i < TILE_COUNT; i++) if (state[i] !== i) return;
    if (introOn) return;
    if (tutorialOn) return;
    solved = true;
    var answerViewed = demoOn || demoUsed;
    var assisted = answerViewed || hintUsed;
    if (!assisted && !freeMode) clearedStages.add(stageNo);
    updateStageOptions();
    var allClear = clearedStages.size === 15;
    winFeedback(allClear, answerViewed, hintUsed, freeMode);
    board.classList.add('won');
    tiles.forEach(function(t, i){ t.style.animationDelay = (i * 26) + 'ms'; });
    setKnobsEnabled(false);
    refresh();
    if (answerViewed){
      say('答えを確認しました。「この問題の最初から」で、自力クリアに挑戦できます。');
    } else if (hintUsed){
      say('次の一手を使ったため練習クリアです。「この問題の最初から」で再挑戦できます。');
    } else if (freeMode){
      say('上級者用フリーをクリア！ 手数制限なしで完成しました。', true);
    } else if (allClear){
      nextBtn.textContent = '全15問クリア';
      say('全問クリア！ 15問すべて完成しました。お見事です。', true);
    } else if (stageNo >= 15){
      say('クリア！ プルダウンから未クリアの問題に挑戦しましょう。', true);
    } else if (moves === puzzlePar) say('最短手数でクリア！ 「次の問題へ」で進みましょう。', true);
    else say('クリア！ ' + moves + '手で完成しました。「次の問題へ」で進みましょう。', true);
  }

  /* ---------- 1〜3手の問題を作る ---------- */
  function scramble(n, useSaved){
    stopDemo(true);
    freeMode = false;
    if (celebration) celebration.classList.remove('show');
    qualityMode = false; hintUsed = false;
    hintBtn.classList.remove('live');
    hintLabel.textContent = '次の一手を見る';
    board.classList.remove('won');
    tiles.forEach(function(t){ t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; });
    setKnobsEnabled(true);
    solved = false; moves = 0; history = []; busy = false; demoUsed = false;
    puzzlePar = Math.max(1, Math.min(5, n || puzzlePar));
    nextBtn.innerHTML = '<span class="nav-label">次へ</span> →';
    var chosen = useSaved && stageRecords[stageNo];
    if (!chosen){
      var root = [], i;
      for (i = 0; i < TILE_COUNT; i++) root[i] = i;
      var frontier = [{ s:root, path:[] }];
      var layers = [frontier];
      var seen = new Map([[root.join(''), 0]]);
      var layerThree = [];
      function fixedCount(s){
        var count = 0;
        for (var pos = 0; pos < TILE_COUNT; pos++) if (s[pos] === pos) count++;
        return count;
      }
      for (var depth = 0; depth < puzzlePar; depth++){
        var nextLayer = [];
        frontier.forEach(function(node){
          for (var p = 0; p < PIVOT_COUNT; p++){
            for (var dir = 0; dir < 2; dir++){
              var cw = dir === 0;
              var next = permuteArray(node.s, p, cw);
              var key = next.join('');
              if (seen.has(key)) continue;
              seen.set(key, depth + 1);
              nextLayer.push({ s:next, path:node.path.concat({ p:p, cw:cw }) });
            }
          }
        });
        frontier = nextLayer;
        layers.push(nextLayer);
        if (depth + 1 === 3) layerThree = nextLayer.slice();
      }
      function approachable(nodes, targetDepth, allowedNext){
        return nodes.filter(function(node){
          var before = fixedCount(node.s), improvingMoves = 0, visibleAnswers = 0;
          for (var p = 0; p < PIVOT_COUNT; p++){
            for (var dir = 0; dir < 2; dir++){
              var candidate = permuteArray(node.s, p, dir === 0);
              if (fixedCount(candidate) > before){
                improvingMoves++;
                var candidateKey = candidate.join('');
                if (seen.get(candidateKey) === targetDepth &&
                    (!allowedNext || allowedNext.has(candidateKey))) visibleAnswers++;
              }
            }
          }
          return improvingMoves === 1 && visibleAnswers === 1;
        });
      }
      var curatedThree = approachable(layerThree, 2);
      if (puzzlePar === 3) frontier = curatedThree;
      if (puzzlePar >= 4){
        var desiredChoices = (stageNo === 12 || stageNo === 15) ? 2 : 1;
        var smooth = [new Set([root.join('')])];
        for (var smoothDepth = 1; smoothDepth < puzzlePar; smoothDepth++){
          var smoothSet = new Set();
          layers[smoothDepth].forEach(function(node){
            var before = fixedCount(node.s), valid = 0;
            for (var p = 0; p < PIVOT_COUNT; p++){
              for (var dir = 0; dir < 2; dir++){
                var candidate = permuteArray(node.s, p, dir === 0);
                var candidateKey = candidate.join('');
                if (fixedCount(candidate) > before &&
                    seen.get(candidateKey) === smoothDepth - 1 &&
                    smooth[smoothDepth - 1].has(candidateKey)) valid++;
              }
            }
            if (valid === 1) smoothSet.add(node.s.join(''));
          });
          smooth.push(smoothSet);
        }
        frontier = frontier.filter(function(node){
          var before = fixedCount(node.s), improvingMoves = 0, valid = 0;
          for (var p = 0; p < PIVOT_COUNT; p++){
            for (var dir = 0; dir < 2; dir++){
              var candidate = permuteArray(node.s, p, dir === 0);
              var candidateKey = candidate.join('');
              if (fixedCount(candidate) > before){
                improvingMoves++;
                if (seen.get(candidateKey) === puzzlePar - 1 &&
                    smooth[puzzlePar - 1].has(candidateKey)) valid++;
              }
            }
          }
          return improvingMoves === desiredChoices && valid === 1;
        });
      }
      var usedSameDepth = new Set();
      Object.keys(stageRecords).forEach(function(stageKey){
        var stageNumber = Number(stageKey);
        var recordPar = stageNumber >= 13 ? 5 :
          (stageNumber >= 10 ? 4 : Math.min(3, Math.ceil(stageNumber / 3)));
        if (recordPar === puzzlePar) usedSameDepth.add(stageRecords[stageKey].s.join(''));
      });
      var unusedSameDepth = frontier.filter(function(node){ return !usedSameDepth.has(node.s.join('')); });
      if (unusedSameDepth.length) frontier = unusedSameDepth;
      chosen = frontier[Math.floor(Math.random() * frontier.length)];
      stageRecords[stageNo] = { s:chosen.s.slice(), path:chosen.path.slice() };
    }
    state = chosen.s.slice();
    scrambleMoves = chosen.path.slice();

    relayout();
    refresh();
    say((stageNo === 15 ? '最後の問題' : '問題 ' + stageNo) + ' — 最短' + puzzlePar + '手。' +
      (stageNo === 1
        ? '盤面をスワイプして、4枚を90°回してみましょう。'
        : puzzlePar >= 3
        ? '回した後の4枚を想像して、次の1手を選んでください。'
        : '回した後の4枚を想像してみてください。'));
    if (!introOn) {
      strategyBtn.classList.remove('attention');
      void strategyBtn.offsetWidth;
      strategyBtn.classList.add('attention');
      if (stageNo === 15) showFinalFeedback();
      else showStartFeedback();
    }
  }

  /* ---------- 時間 ---------- */

  function showBoardNotice(text, isStart, isFinal){

    } else {
      resetNotice.textContent = text;
    }
    resetNotice.classList.toggle('start', !!isStart);
    resetNotice.classList.toggle('final', !!isFinal);

    board.classList.add(isFinal ? 'final-feedback' : 'reset-feedback');
    resetNotice.classList.add('show');
    boardNoticeTimer = setTimeout(function(){
      board.classList.remove('reset-feedback', 'final-feedback');

  function showFinalFeedback(){ showBoardNotice('FINAL', false, true); }

  function playMoveSound(homeHits){
    if (introOn || demoOn) return;
    var AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return;
    try {
      audioContext = audioContext || new AudioCtor();
      if (audioContext.state === 'suspended') audioContext.resume();
      var now = audioContext.currentTime;
      var gain = audioContext.createGain();
      var low = audioContext.createOscillator();
      var high = audioContext.createOscillator();
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(.12, now + .008);
      gain.gain.exponentialRampToValueAtTime(.0001, now + .12);
      low.type = 'triangle';
      low.frequency.setValueAtTime(homeHits ? 180 : 135, now);
      low.frequency.exponentialRampToValueAtTime(homeHits ? 260 : 190, now + .08);
      high.type = 'sine';
      high.frequency.setValueAtTime(homeHits ? 720 : 470, now);
      high.frequency.exponentialRampToValueAtTime(homeHits ? 1040 : 620, now + .09);
      low.connect(gain); high.connect(gain); gain.connect(audioContext.destination);
      low.start(now); high.start(now);
      low.stop(now + .13); high.stop(now + .13);
    } catch (e) {}
  }

  function moveBurst(){
    for (var i = 0; i < 12; i++){
      var spark = document.createElement('i');
      var angle = Math.PI * 2 * i / 12 + (i % 2 ? .12 : 0);
      var distance = 34 + (i % 3) * 12;
      spark.className = 'move-spark' + (i % 3 === 0 ? ' brass' : '');
      spark.style.setProperty('--spark-x', Math.cos(angle) * distance + 'px');
      spark.style.setProperty('--spark-y', Math.sin(angle) * distance + 'px');
      board.appendChild(spark);
      setTimeout(function(node){ node.remove(); }, 520, spark);
    }
  }

  function moveFeedback(cyc, p){
    board.classList.remove('move-done');
    for (var i = 0; i < cyc.length; i++)
      tiles[state[cyc[i]]].classList.remove('just-moved', 'landed-home');
    knobs[p].classList.remove('impact');
    var impact = knobXY(p);
    board.style.setProperty('--impact-x', (impact.x / board.clientWidth * 100) + '%');
    board.style.setProperty('--impact-y', (impact.y / board.clientHeight * 100) + '%');
    void board.offsetWidth;
    board.classList.add('move-done');
    var homeHits = 0;
    for (var j = 0; j < cyc.length; j++){
      tiles[state[cyc[j]]].classList.add('just-moved');
      if (state[cyc[j]] === cyc[j]){
        tiles[state[cyc[j]]].classList.add('landed-home');
        homeHits++;
      }
    }
    knobs[p].classList.add('impact');
    moveBurst();
    playMoveSound(homeHits);
    if (navigator.vibrate) navigator.vibrate(homeHits ? [18,22,32] : [14,18,20]);
    setTimeout(function(){
      board.classList.remove('move-done');
      tiles.forEach(function(t){ t.classList.remove('just-moved', 'landed-home'); });
      knobs[p].classList.remove('impact');
    }, 520);
  }

  /* ---------- プレビュー ---------- */
  function preview(p, on, cw){
    var cyc = cellsOf(p);
    board.classList.toggle('previewing', on);
    for (var j = 0; j < 4; j++) tiles[state[cyc[j]]].classList.toggle('lit', on);
    orbits[p].classList.toggle('show', on);
    orbits[p].classList.toggle('rev', !cw);
    knobs[p].classList.toggle('hot', on);
  }
  function clearPreview(){
    board.classList.remove('previewing','quality-good','quality-same','quality-bad');
    hoverPreviewP = -1;
    if (qualityLabel) qualityLabel.className = 'quality-label';
    tiles.forEach(function(t){ t.classList.remove('lit'); });
    orbits.forEach(function(o){ o.classList.remove('show'); });
    knobs.forEach(function(k){
      k.classList.remove('hot','press-cw','press-ccw','hinting','evaluating',
        'cw-good','cw-same','cw-bad','ccw-good','ccw-same','ccw-bad');
    });
    orbits.forEach(function(o){ o.classList.remove('hinting'); });
  }

  /* ---------- ドラッグ（スワイプ）で回す ----------
     盤のどこをつかんでも、いちばん近い交点が軸になる。
     指の回転角ぶんだけ4枚が何周でも追従し、離すと90°単位に吸着する。 */
  var drag = null;

  function localPoint(e){
    var r = board.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function nearestPivot(x, y){
    var best = 0, bd = Infinity;
    for (var p = 0; p < PIVOT_COUNT; p++){
      var k = knobXY(p), d = (k.x - x) * (k.x - x) + (k.y - y) * (k.y - y);
      if (d < bd){ bd = d; best = p; }
    }
    return best;
  }
  var candidatePivot = -1;
  var hoverPreviewP = -1, hoverPreviewCw = true;
  function showCandidate(p){
    if (candidatePivot === p) return;
    if (candidatePivot >= 0) knobs[candidatePivot].classList.remove('candidate');
    candidatePivot = p;
    if (p >= 0) knobs[p].classList.add('candidate');
  }
  function clearMoveQuality(p){
    board.classList.remove('quality-good','quality-same','quality-bad');
    qualityLabel.className = 'quality-label';
    knobs[p].classList.remove('evaluating',
      'cw-good','cw-same','cw-bad','ccw-good','ccw-same','ccw-bad');
  }
  function showMoveQuality(p, cw){
    clearMoveQuality(p);
    hintUsed = true;
    var currentKey = state.join('');
    var nextKey = permuteArray(state, p, cw).join('');
    var otherKey = permuteArray(state, p, !cw).join('');
    var before = distanceForKey(currentKey);
    var after = distanceForKey(nextKey);
    var otherAfter = distanceForKey(otherKey);
    var kind = after < before ? 'good' : (after === before ? 'same' : 'bad');
    var otherKind = otherAfter < before ? 'good' : (otherAfter === before ? 'same' : 'bad');
    knobs[p].classList.add('evaluating');
    knobs[p].classList.add((cw ? 'cw-' : 'ccw-') + kind);
    knobs[p].classList.add((cw ? 'ccw-' : 'cw-') + otherKind);
    board.classList.add('quality-' + kind);
    qualityLabel.className = 'quality-label show' + (kind === 'good' ? '' : ' ' + kind);
    var direction = cw ? '↻ 右回り' : '↺ 左回り';
    qualityLabel.textContent = direction + (kind === 'good'
      ? 'で近づく  ' + before + ' → ' + after
      : (kind === 'same' ? 'では変わらない  ' + before + ' → ' + after : 'では遠ざかる  ' + before + ' → ' + after));
  }
  function showTutorialMoveQuality(p, cw){
    if (!tutorialOn || tutorialStep >= tutorialSteps.length) return;
    clearMoveQuality(p);
    var expected = tutorialSteps[tutorialStep];
    var correctPivot = p === expected.p;
    var kind = correctPivot && cw === expected.cw ? 'good' : 'bad';
    var otherKind = correctPivot && !cw === expected.cw ? 'good' : 'bad';
    knobs[p].classList.add('evaluating');
    knobs[p].classList.add((cw ? 'cw-' : 'ccw-') + kind);
    knobs[p].classList.add((cw ? 'ccw-' : 'cw-') + otherKind);
    board.classList.add('quality-' + kind);
    qualityLabel.className = 'quality-label show' + (kind === 'good' ? '' : ' bad');
    var direction = cw ? '↻ 右回り' : '↺ 左回り';
    qualityLabel.textContent = direction + (kind === 'good'
      ? '　この方向'
      : (correctPivot ? '　反対方向です' : '　別の軸です'));
  }
  function xf(it, deg, kc){
    var rad = deg * Math.PI / 180, c = Math.cos(rad), sn = Math.sin(rad);
    var nx = it.ox * c - it.oy * sn, ny = it.ox * sn + it.oy * c;
    return 'translate(' + (kc.x + nx - CELL/2) + 'px,' + (kc.y + ny - CELL/2) + 'px)';
  }
  function angleAt(pt, kc){ return Math.atan2(pt.y - kc.y, pt.x - kc.x) * 180 / Math.PI; }

  board.addEventListener('pointerdown', function(e){
    if (introOn || busy || solved || demoOn || drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest && e.target.closest('.half')) return;   // つまみのボタンは従来どおり

    var pt = localPoint(e);
    var p = nearestPivot(pt.x, pt.y), kc = knobXY(p);
    if (Math.hypot(pt.x - kc.x, pt.y - kc.y) < 10) return;       // 軸のど真ん中は角度が定まらない

    var cyc = cellsOf(p), items = [];
    for (var j = 0; j < 4; j++){
      var c = cellCenter(cyc[j]);
      items.push({ el: tiles[state[cyc[j]]], ox: c.x - kc.x, oy: c.y - kc.y });
    }
    var a = angleAt(pt, kc);
    drag = { p: p, kc: kc, items: items, lastAngle: a, deg: 0, t0: Date.now(),
      id: e.pointerId, hintCw: null };
    showCandidate(-1);
    try { board.setPointerCapture(e.pointerId); } catch (_) {}
    board.classList.add('dragging');
    clearPreview();
    preview(p, true, true);
    e.preventDefault();
  });

  board.addEventListener('pointermove', function(e){
    if (!drag){
      if (e.pointerType !== 'touch' && !busy && !solved && !demoOn && !tutorialOn){
        var hoverPt = localPoint(e);
        var hoverP = nearestPivot(hoverPt.x, hoverPt.y);
        var hoverCw = hoverPt.x >= knobXY(hoverP).x;
        if (hoverP !== hoverPreviewP || hoverCw !== hoverPreviewCw){
          clearPreview();
          showCandidate(hoverP);
          preview(hoverP, true, hoverCw);
          knobs[hoverP].classList.add(hoverCw ? 'press-cw' : 'press-ccw');
          if (qualityMode) showMoveQuality(hoverP, hoverCw);
          hoverPreviewP = hoverP;
          hoverPreviewCw = hoverCw;
        }
      }
      return;
    }
    if (e.pointerId !== drag.id) return;
    var a = angleAt(localPoint(e), drag.kc);
    var delta = a - drag.lastAngle;
    while (delta > 180) delta -= 360;
    while (delta < -180) delta += 360;
    drag.deg += delta;
    drag.lastAngle = a;
    var d = drag.deg;
    for (var i = 0; i < drag.items.length; i++)
      drag.items[i].el.style.transform = xf(drag.items[i], d, drag.kc);

    var cw = d >= 0, shown = Math.abs(d) > 5;
    orbits[drag.p].classList.toggle('rev', !cw);
    knobs[drag.p].classList.toggle('press-cw',  cw && shown);
    knobs[drag.p].classList.toggle('press-ccw', !cw && shown);
    var moveQualityOn = qualityMode || (tutorialOn && tutorialHintVisible);
    if (moveQualityOn && shown && drag.hintCw !== cw){
      if (tutorialOn) showTutorialMoveQuality(drag.p, cw);
      else showMoveQuality(drag.p, cw);
      drag.hintCw = cw;
    } else if (moveQualityOn && !shown && drag.hintCw !== null){
      clearMoveQuality(drag.p);
      drag.hintCw = null;
    }
  });

  function endDrag(e){
    if (!drag || (e && e.pointerId !== drag.id)) return;
    var dg = drag, d = dg.deg, ms = Date.now() - dg.t0;
    drag = null;
    board.classList.remove('dragging');
    try { board.releasePointerCapture(dg.id); } catch (_) {}

    // 最寄りの90°へ吸着。最初の1手だけは従来どおり、素早いフリックも拾う。
    var turns = Math.round(d / 90);
    if (turns === 0 && Math.abs(d) >= 14 && ms < 300) turns = d >= 0 ? 1 : -1;
    var tutorialAccepted = tutorialOn && turns !== 0 && tutorialAllows(dg.p, turns > 0, Math.abs(turns));
    if (tutorialOn && turns !== 0 && !tutorialAccepted) turns = 0;
    var target = turns * 90;
    var cyc = cellsOf(dg.p);

    if (turns){
      var cw = turns > 0;
      for (var turn = 0; turn < Math.abs(turns); turn++){
        state = permute(dg.p, cw);
        logMove(dg.p, cw);
      }
    }

    busy = true;
    var dur = reduce ? 1 : Math.max(90, Math.round(Math.abs(target - d) * 1.7));
    var frames = [], steps = 4, i;
    for (i = 0; i <= steps; i++) frames.push(d + (target - d) * i / steps);

    var done = 0;
    dg.items.forEach(function(it){
      var ks = frames.map(function(a){ return { transform: xf(it, a, dg.kc) }; });
      it.el.style.transform = xf(it, target, dg.kc);
      var an = it.el.animate(ks, { duration: dur, easing: 'cubic-bezier(.2,.7,.3,1)' });
      an.onfinish = an.oncancel = function(){
        if (++done === 4){
          busy = false;
          for (var q = 0; q < 4; q++) place(state[cyc[q]], cyc[q]);   // 誤差を残さない
          clearPreview();
          moveFeedback(cyc, dg.p); refresh(); check();
          if (tutorialAccepted) advanceTutorial();
          else if (tutorialOn) renderTutorial();
        }
      };
    });
    refresh();
  }
  board.addEventListener('pointerup', endDrag);
  board.addEventListener('pointercancel', endDrag);
  board.addEventListener('pointerleave', function(){
    if (!drag){
      clearPreview();
      showCandidate(-1);
      hoverPreviewP = -1;
    }
  });

  /* ---------- 入力 ---------- */
  var hovered = -1;
  function bindKnobs(){
    knobs.forEach(function(k, p){
      var halves = k.querySelectorAll('button');
      for (var h = 0; h < halves.length; h++){
        (function(btn, cw){
          btn.addEventListener('mouseenter', function(){ if (tutorialOn) return; hovered = p; preview(p, true, cw); });
          btn.addEventListener('mouseleave', function(){ hovered = -1; if (tutorialOn) renderTutorial(); else clearPreview(); });
          btn.addEventListener('focus',      function(){ if (tutorialOn) return; hovered = p; preview(p, true, cw); });
          btn.addEventListener('blur',       function(){ hovered = -1; if (tutorialOn) renderTutorial(); else clearPreview(); });
          btn.addEventListener('click', function(e){
            e.preventDefault();
            if (demoOn) return;
            rotate(p, cw, { log: true, count: true });
            if (tutorialOn){
              if (!busy) renderTutorial();
            } else preview(p, true, cw);     // 回したあとも軌道と光を残す
          });
          btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
        })(halves[h], halves[h].classList.contains('cw'));
      }
    });
  }

  document.addEventListener('keydown', function(e){
    if (introOn){
      if (introReview && e.key === 'Escape'){ e.preventDefault(); beginGame(); }
      return;
    }
    if (tutorialGuideOn){
      if (e.key === 'Escape'){ e.preventDefault(); closeTutorialGuide(true); }

    }

      if (e.key === 'Escape'){ e.preventDefault(); closeAdvanced(); }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var key = e.key.toLowerCase();
    if (celebration && celebration.classList.contains('show')){
      if (key === 'escape'){ e.preventDefault(); closeCelebration(); }
      else if (key === 'n' && !celebrationNext.hidden){

      }
      return;
    }
    var i = KEYS.indexOf(key);
    if (i < 0) i = NUMKEYS.indexOf(e.key);
    if (i >= 0){ e.preventDefault(); if (!demoOn) rotate(i, !e.shiftKey, { log: true, count: true }); return; }
    if (key === 'u'){ e.preventDefault(); undo(); }

      else scramble();
    }
    else if (key === 'h'){ e.preventDefault(); showHint(); }
    else if (key === 'g' || key === 'd'){ e.preventDefault(); toggleDemo(); }
    else if (key === 't'){ e.preventDefault(); openTutorialGuide('adjacent'); }
    else if (key === 'n' && solved && !tutorialOn){ e.preventDefault(); nextPuzzle(); }
    else if (key === 'p' && stageNo > 1 && !tutorialOn){ e.preventDefault(); prevPuzzle(); }
  });
  /* ---------- AUTO ----------
     3×3では全状態を現実的な時間で探索できる。
     完成形から幅優先探索し、現在盤面へ至る本当の最短経路を逆向きに返す。 */
  function permuteArray(src, p, cw){
    var cyc = cellsOf(p), next = src.slice();
    for (var k = 0; k < 4; k++){
      if (cw) next[cyc[(k+1) % 4]] = src[cyc[k]];
      else    next[cyc[k]] = src[cyc[(k+1) % 4]];
    }
    return next;
  }

  function permutationRank(src){
    var rank = 0, factor = 1;
    for (var i = TILE_COUNT - 1; i >= 0; i--){
      var smaller = 0;
      for (var j = i + 1; j < TILE_COUNT; j++) if (src[j] < src[i]) smaller++;
      rank += smaller * factor;
      factor *= TILE_COUNT - i;
    }
    return rank;
  }

  function startSolverWorker(){
    if (solverWorker || fullSolverDistance || !window.Worker) return;
    var workerSource =
      'var N=9,TOTAL=362880,C=[[0,1,4,3],[1,2,5,4],[3,4,7,6],[4,5,8,7]];' +
      'function rank(s){var r=0,f=1;for(var i=N-1;i>=0;i--){var n=0;for(var j=i+1;j<N;j++)if(s[j]<s[i])n++;r+=n*f;f*=N-i}return r}' +
      'function unrank(r){var pool=[0,1,2,3,4,5,6,7,8],digits=new Array(N),s=new Array(N);for(var i=1;i<=N;i++){digits[N-i]=r%i;r=Math.floor(r/i)}for(var k=0;k<N;k++)s[k]=pool.splice(digits[k],1)[0];return s}' +
      'function turn(s,p,cw){var n=s.slice(),c=C[p];for(var k=0;k<4;k++)if(cw)n[c[(k+1)%4]]=s[c[k]];else n[c[k]]=s[c[(k+1)%4]];return n}' +
      'var d=new Int8Array(TOTAL),m=new Int8Array(TOTAL),q=new Int32Array(TOTAL);d.fill(-1);m.fill(-1);d[0]=0;var h=0,t=1;q[0]=0;' +
      'while(h<t){var r=q[h++],s=unrank(r),nd=d[r]+1;for(var p=0;p<4;p++)for(var z=0;z<2;z++){var cw=z===0,n=turn(s,p,cw),nr=rank(n);if(d[nr]>=0)continue;d[nr]=nd;m[nr]=p*2+(cw?0:1);q[t++]=nr}}' +
      'postMessage({distance:d.buffer,move:m.buffer},[d.buffer,m.buffer]);';
    try {
      var blobUrl = URL.createObjectURL(new Blob([workerSource], { type:'text/javascript' }));
      solverWorker = new Worker(blobUrl);
      solverWorker.onmessage = function(e){
        fullSolverDistance = new Int8Array(e.data.distance);
        fullSolverMove = new Int8Array(e.data.move);
        solverWorker.terminate(); solverWorker = null;
        URL.revokeObjectURL(blobUrl);
      };
      solverWorker.onerror = function(){
        solverWorker.terminate(); solverWorker = null;
        URL.revokeObjectURL(blobUrl);
      };
    } catch (e) { solverWorker = null; }
  }

  function buildSolvedTail(){
    if (solvedTailReady) return;
    var solvedState = [], id;
    for (id = 0; id < TILE_COUNT; id++) solvedState[id] = id;
    var solvedKey = solvedState.join('');
    var queue = [solvedState], head = 0;
    solvedTailNext.set(solvedKey, null);
    solvedTailDepth.set(solvedKey, 0);
    while (head < queue.length){
      var src = queue[head++], srcKey = src.join('');
      var depth = solvedTailDepth.get(srcKey);
      if (depth >= 5) continue;
      for (var p = 0; p < PIVOT_COUNT; p++){
        for (var dir = 0; dir < 2; dir++){
          var cw = dir === 0;
          var next = permuteArray(src, p, cw);
          var key = next.join('');
          if (solvedTailDepth.has(key)) continue;
          solvedTailDepth.set(key, depth + 1);
          solvedTailNext.set(key, srcKey);
          solvedTailMove.set(key, { p:p, cw:!cw });
          queue.push(next);
        }
      }
    }
    solvedTailReady = true;
  }

  function cacheSolution(src, path){
    var cacheState = src.slice();
    for (var step = 0; step <= path.length; step++){
      var key = cacheState.join('');
      if (!solutionCache.has(key)) solutionCache.set(key, path.slice(step));
      distanceCache.set(key, path.length - step);
      if (step < path.length)
        cacheState = permuteArray(cacheState, path[step].p, path[step].cw);
    }
  }

  function solutionFor(src){
    var targetKey = src.join('');
    if (solutionCache.has(targetKey)) return solutionCache.get(targetKey).slice();
    if (fullSolverMove){
      var direct = [], directState = src.slice(), rank = permutationRank(directState);
      while (rank !== 0){
        var code = fullSolverMove[rank];
        var move = { p:Math.floor(code / 2), cw:!!(code & 1) };
        direct.push(move);
        directState = permuteArray(directState, move.p, move.cw);
        rank = permutationRank(directState);
      }
      cacheSolution(src, direct);
      return direct.slice();
    }
    buildSolvedTail();

    var states = [src.slice()], keys = [targetKey], depths = [0], head = 0;
    var seen = new Map([[targetKey, 0]]);
    var parent = new Map(), via = new Map();
    var bestMeet = null, bestTotal = Infinity;

    while (head < states.length){
      var current = states[head], currentKey = keys[head], currentDepth = depths[head];
      head++;
      if (currentDepth >= bestTotal) break;
      if (solvedTailDepth.has(currentKey)){
        var total = currentDepth + solvedTailDepth.get(currentKey);
        if (total < bestTotal){ bestTotal = total; bestMeet = currentKey; }
      }
      if (currentDepth + 1 >= bestTotal) continue;
      for (var p = 0; p < PIVOT_COUNT; p++){
        for (var dir = 0; dir < 2; dir++){
          var cw = dir === 0;
          var next = permuteArray(current, p, cw);
          var key = next.join('');
          if (seen.has(key)) continue;
          seen.set(key, currentDepth + 1);
          parent.set(key, currentKey);
          via.set(key, { p:p, cw:cw });
          states.push(next); keys.push(key); depths.push(currentDepth + 1);
        }
      }
    }

    var forward = [], walk = bestMeet;
    while (walk !== targetKey){
      forward.push(via.get(walk));
      walk = parent.get(walk);
    }
    forward.reverse();
    walk = bestMeet;
    while (solvedTailNext.get(walk) !== null){
      forward.push(solvedTailMove.get(walk));
      walk = solvedTailNext.get(walk);
    }
    cacheSolution(src, forward);
    return forward.slice();
  }

  function distanceForKey(key){
    if (fullSolverDistance) return fullSolverDistance[permutationRank(key.split('').map(Number))];
    if (!distanceCache.has(key)){
      var src = key.split('').map(Number);
      cacheSolution(src, solutionFor(src));
    }
    return distanceCache.get(key);
  }

  function autoQueue(){
    return solutionFor(state);
  }

  function tutorialAllows(p, cw, turns){

  function renderTutorial(){
